services:
  login-seguro:
    build: .
    container_name: login-seguro
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: "troque-por-uma-chave-secreta-forte"
      DATABASE_PATH: "/data/login.db"
    volumes:
      - dados_login:/data
    restart: unless-stopped

volumes:
  dados_login:
